# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: The Timescape
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: walkerofthewoods.github.io/timescape-site
  publishAssets: referenced
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title:
        name: Cinzel
        weights: [400, 700]
      header:
        name: Cinzel
        weights: [400, 600, 700]
      body: Source Sans 3
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f6f0e4"
        lightgray: "#e4d8c3"
        gray: "#8a7b66"
        darkgray: "#382f27"
        dark: "#1f1914"
        secondary: "#a9482c"
        tertiary: "#9c6d1b"
        highlight: rgba(196, 146, 43, 0.14)
        textHighlight: rgba(214, 165, 62, 0.35)
      darkMode:
        light: "#151210"
        lightgray: "#332a22"
        gray: "#948470"
        darkgray: "#d6cab8"
        dark: "#f2e7d3"
        secondary: "#dfa946"
        tertiary: "#df7854"
        highlight: rgba(223, 169, 70, 0.15)
        textHighlight: rgba(223, 120, 84, 0.32)
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: its-theme
      mode: both
      variation: ttrpg-dnd
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: false
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: "@quartz-community/obsidian-plugin-ttrpg-tools-maps"
    enabled: true
    options:
      blockLanguage: zoommap
      inlineBlockHeaderId: ZOOMMAP-DATA
      maxInlineDataBytes: 0
      defaultIconKey: pin-red
    order: 55
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
