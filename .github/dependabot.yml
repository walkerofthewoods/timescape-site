version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Major dependency bumps (such as js-yaml@5, typescript@7, preact, vfile, or unified)
    # can break upstream Quartz internals and peer-dependent plugins at runtime. Upgrade majors
    # deliberately together with upstream Quartz rather than via automated PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
      # Isolated because a compiler major needs a tsconfig migration of its own.
      typescript:
        applies-to: "version-updates"
        patterns:
          - "typescript"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
          - "typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
