name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate vault repository configuration
        env:
          VAULT_REPO: ${{ vars.VAULT_REPO }}
        run: |
          if [ -z "$VAULT_REPO" ]; then
            echo "::error::Repository variable VAULT_REPO is not set. Set VAULT_REPO to <owner>/<vault-repo> in GitHub repository Settings -> Secrets and variables -> Actions -> Variables (and add a read-only VAULT_TOKEN secret if the vault repo is private)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout Obsidian vault
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.VAULT_REPO }}
          token: ${{ secrets.VAULT_TOKEN || github.token }}
          path: _vault
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npm run install-plugins
      - name: Run script unit tests
        run: npm run test:scripts
      - name: Sync player-facing vault content
        env:
          TIMESCAPE_VAULT: ${{ github.workspace }}/_vault
        run: npm run sync:vault
      - name: Build site
        run: npm run build
      - name: Verify built site
        run: npm run check:site
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Test built site in Playwright
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
